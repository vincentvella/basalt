schema: spec-driven

context: |
  basalt-core: React Native on the desktop (Linux/GTK4, macOS/AppKit,
  Windows/Win32) on React Native's own ReactCxxPlatform C++ core.

  Where things live. There is no plan/ directory; everything is a spec or an
  architecture doc, and adding a third place is the thing to avoid:
    openspec/specs/     what the platform is required to do
    openspec/changes/   work proposed or under way -- all new work starts here
    docs/ARCHITECTURE.md  how it is built
    docs/PORTING.md     building the core somewhere new: Hermes, MSVC, versions
    docs/BACKLOG.md     known gaps, unscheduled, one file per area under backlog/
    docs/DECISIONS.md   choices made, so they are not re-litigated
    docs/TESTING.md     the four suites and what they cannot see

  A capability that is implemented on one host must be implemented or honestly
  refused on all three; core/ decides anything the three would otherwise be
  free to disagree about.

# Project context (optional)
