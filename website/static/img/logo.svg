<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
<!--
  Basalt's mascot: an Atlantic puffin, in profile.

  The bird rather than the rock. Columnar basalt is the Giant's Causeway and
  Iceland, and the puffin nests on both, so the mascot is what lives on the
  thing the project is named after. Rust's crab has less of a claim.

  Profile, and that is the whole of why this one works where several earlier
  attempts did not: a puffin's bill is flattened side to side, so head on it is
  narrow and the bird reads as a penguin. Drawn from a public-domain USFWS
  photograph and the 1905 anatomical plate of puffin heads on Wikimedia
  Commons, which is where the cheek patch, the dark collar and the two-tone
  bill come from.

  This is the full drawing. For 32 pixels and below use the simplified one.

  Four files, because the bird is two colours and neither survives on the
  wrong ground: logo.svg and logo-inverse.svg are the drawing in full, for a
  README header or anywhere it is shown large; logo-light.svg and
  logo-dark.svg are simplified for the navbar's 22 pixels, where the toes, the
  brow and the bill's groove all collapse into mud. favicon.svg is the
  simplified one again.
-->
