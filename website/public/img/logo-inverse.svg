<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
<!--
  logo.svg on a dark ground: the same bird, not its negative.

  This file used to be a straight swap of the two neutrals, which flipped the
  markings the bird is recognised by: a white back over a black belly, and a
  white eye lost in a white head. A puffin read as a photographic negative.

  So only the dark half moves, and it moves up rather than across. The back and
  the collar go to a slate that separates from #16181D, about 2.9:1, which is
  plenty for a shape this size, while still reading as the dark half. The
  belly, the cheek and the bill are untouched, and the eye stays ink, because
  it is still an eye on a white cheek.

  Everything else about the drawing is logo.svg's; see its header.
-->
<defs><clipPath id="k"><path d="M40 9 C33 3 21 5 17 14 C12 24 11 36 14 43 L4 48 L15 51 C20 57 33 59 40 53 C47 47 50 36 49 27 C48 18 44 12 40 9 Z"/></clipPath></defs>
