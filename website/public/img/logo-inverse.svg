<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
<!--
  Basalt's mascot: an Atlantic puffin, in profile.

  The bird rather than the rock. Columnar basalt is the Giant's Causeway and
  Iceland, and the puffin nests on both, so the mascot is what lives on the
  thing the project is named after.

  Profile, and that is the whole of why this works where several earlier
  attempts did not: a puffin's bill is flattened side to side, so head on it is
  narrow and the bird reads as a penguin.

  This is the large mark, for the README and the site's header, with a little
  air around the bird. logo-light.svg and logo-dark.svg are the same drawing
  cropped closer, for the navbar and the favicon, where the air would be pixels
  not spent on the bird.

  One drawing at every size. A stouter bird held the small sizes for a while
  and read better at sixteen pixels, and it was a second drawing to keep in
  step; this one is what the project looks like.

  Four colours and no others: ink #16181D, bone #F7F6F3, ember #E2561F for the
  bill's tip and the feet, amber #F0B429 for the band behind it. Flat fills,
  no strokes and no gradients, so it survives being scaled.

  The dark ground's version: only the body lifts, to a slate that separates
  from #16181D while staying the dark half of a two-tone bird. Not an
  inversion. A puffin with a white back and a dark belly is a different bird,
  so the belly and the cheek stay bone, and the eye and the brow stay ink
  because they sit on the cheek and would vanish into it otherwise.
-->
