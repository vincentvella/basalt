name: Trusted publisher check

# Asks npm whether a trusted publisher is configured, for each package,
# without publishing anything.
#
# Worth keeping because the failure it diagnoses is otherwise almost mute.
# `npm publish` reports ENEEDAUTH and nothing else, which looks identical to
# a client too old to try, to a missing token, and to a registration that does
# not match. Three release runs and two hand-run publishes went by before the
# real answer turned up, and it was one line at --loglevel verbose.
#
# 200 means the registration matches this repository and workflow. 404
# "package not found" means npm holds no registration it will accept -- not
# that the package is missing; these are all published.
#
# The registration lives on npmjs.com, per package, under Settings ->
# Trusted Publisher, and every field is case-sensitive:
#
#   Organization or user  vincentvella
#   Repository            react-native-basalt
#   Workflow filename     publish.yml        (the filename alone, no path)
#   Environment name      (empty)
#   Allowed actions       must permit `npm publish`; only `npm stage publish`
#                         is allowed by default, and that alone is not enough
on: workflow_dispatch

jobs:
  check:
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Exchange the OIDC token, per package
        run: |
          set -uo pipefail
          tok=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=npm%3Aregistry.npmjs.org" |
            node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{
              process.stdout.write(JSON.parse(s).value||"")})')
          if [ -z "$tok" ]; then echo "no OIDC token"; exit 1; fi
          echo "got an OIDC token (${#tok} chars)"
          echo
          for p in react-native-basalt react-native-basalt-appkit \
                   react-native-basalt-gtk react-native-basalt-notifications \
                   react-native-basalt-subprocess react-native-basalt-win32; do
            body=$(curl -sS -w '\n%{http_code}' -X POST \
              -H "Authorization: Bearer $tok" \
              -H 'Content-Type: application/json' \
              "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/$p")
            code=$(printf '%s' "$body" | tail -1)
            msg=$(printf '%s' "$body" | head -n -1 | head -c 160)
            printf '  %-34s %s  %s\n' "$p" "$code" "$msg"
          done
