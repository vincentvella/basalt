name: CI

# What runs on every push. Linux is the target, so Linux is checked in full.
# Every bug this project has hit that only appears on one platform has appeared
# there -- a root-owned npm prefix, libstdc++ against React Native's -Werror, a
# renderer that mangles transforms -- and none of them was visible from the
# machine it was developed on.
#
# That machine is now a Windows box, which is why the whole Windows stack is
# built and tested here too. macOS is not, and neither is anything that is only
# worth its cost before a release -- building from nothing with no caches,
# installing the packed packages into a fresh app, the MSBuild generator. That
# is .github/workflows/release.yml.
#
# ## Caches
#
# Every expensive thing is cached, and every cache is saved by its own step
# straight after the step that produced it, not by actions/cache's post-job
# hook. That hook saves only when the *whole job* succeeds, so one failing test
# threw away a Hermes build, a vcpkg install and a compile -- the better part of
# an hour on Windows -- and the run that fixed the test paid all of it again.
#
# Cold, the Windows job is about an hour: vcpkg 20 minutes, Hermes 13, the build
# 17. Warm it is a few minutes, and a step that takes as long warm as cold is a
# key that is wrong.
#
# GitHub evicts a cache nobody has read for seven days, and a quiet week would
# then cost the next push that hour. The schedule below runs the Linux and
# Windows jobs twice a week for no other reason than to read them.

on:
  push:
    branches: [main, ci]
    # Prose needs no compiler. Most commits here are a docs/ write-up or a
    # README line, and each one was paying for every build job.
    paths-ignore: ["docs/**", "openspec/**", "**/*.md"]
  pull_request:
    paths-ignore: ["docs/**", "openspec/**", "**/*.md"]
  workflow_dispatch:
    inputs:
      drift:
        description: "Also build against React Native main"
        type: boolean
        default: false
  # release.yml calls this with cold: true, to build everything from nothing:
  # every restore below is skipped, so a cache that is stale in a way no key or
  # stamp can see -- a Hermes built with last month's flags -- cannot make a
  # release look green. The saves still run, so a release leaves warm caches.
  workflow_call:
    inputs:
      cold:
        type: boolean
        default: false
  schedule:
    # Monday: keeps the caches warm, and runs `drift`.
    - cron: "17 6 * * 1"
    # Thursday: keeps the caches warm. Twice a week rather than once, because
    # once a week is exactly the eviction window and a late runner misses it.
    - cron: "17 6 * * 4"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded runs on a branch, never on main.
  #
  # Cancelling is right for a branch: nobody needs the result for a commit that
  # has already been replaced, and a held runner delays the commit they do need.
  # On main it loses the only record that a commit was ever tested, and a
  # cancelled job is not a failed one, so nothing says so. That is not
  # hypothetical here: the Linux job was cancelled on five consecutive pushes to
  # main while Windows failed on every one of them, and what finally exposed it
  # was a sixth push adding a macOS job -- whose failure was then assumed to be
  # new. Five red runs read as four cancellations and a mystery.
  #
  # The cost is that quick successive pushes to main queue rather than cancel.
  # Runners are free on a public repository, so the bill is patience, and the
  # thing being bought is knowing which commit broke something.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # Everything below is a GTK program, so everything needs a display.
  DISPLAY: ":99"
  GDK_BACKEND: x11

jobs:
  linux:
    name: build and test (shard ${{ matrix.shard }})
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      # The end-to-end suite is nine of this job's thirteen minutes, and every
      # scenario is an independent host process -- so it splits. Three shards
      # rather than more because the rest of the job is fixed cost that each
      # shard pays again: the build is nearly free with ccache, but installing
      # dependencies and bootstrapping are not, and past three the repeated
      # overhead grows faster than the saving.
      #
      # fail-fast off, so one shard failing still lets the others report. A
      # sharded suite where the first failure hides the rest is worse for
      # diagnosis than an unsharded one.
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    steps:
      - uses: actions/checkout@v7

      - name: Read the React Native pin
        id: pin
        # CI builds against a fixed release so that a red tick means this repo
        # regressed for someone who could actually use it, not that React Native
        # moved. The `drift` job below is what tracks main. See
        # docs/PORTING.md.
        run: echo "ref=$(grep -v '^#' scripts/react-native.pin | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            build-essential clang cmake ninja-build pkg-config ccache \
            libgtk-4-dev libpango1.0-dev libglib2.0-dev \
            libgoogle-glog-dev libboost-dev libboost-regex-dev libfmt-dev \
            libdouble-conversion-dev libgflags-dev libssl-dev libcurl4-openssl-dev \
            libgl1-mesa-dri xvfb xdotool x11-utils

      - uses: actions/setup-node@v7
        with:
          # React Native requires ^22.13 || ^24.3 || >= 26. Node 25 is excluded
          # and fails an engine check inside a preinstall hook.
          node-version: 24

      - name: Fetch React Native at the pinned release
        # Inside the workspace, not beside it. actions/cache silently declines
        # to save a path that escapes the workspace with `..`, which cost a
        # run: third_party restored, bootstrap skipped yarn install because
        # codegen was already there, and then bundling failed for want of
        # node_modules.
        run: |
          mkdir -p react-native-src && cd react-native-src
          git init -q
          git remote add origin https://github.com/react/react-native
          # One ref, no history: the checkout is ~120MB even so. A tag needs
          # naming in full, since a bare tag name is not a fetchable ref here.
          git fetch -q --depth 1 origin refs/tags/${{ steps.pin.outputs.ref }}
          git checkout -q FETCH_HEAD
          git log --oneline -1

      - name: Restore React Native's node_modules
        id: node-modules
        if: ${{ !inputs.cold }}
        uses: actions/cache/restore@v6
        with:
          path: react-native-src/node_modules
          # Keyed on the commit alone: a fixed commit has a fixed yarn.lock.
          key: rn-node-modules-${{ runner.os }}-${{ steps.pin.outputs.ref }}

      - name: Restore third_party
        id: third-party
        if: ${{ !inputs.cold }}
        uses: actions/cache/restore@v6
        with:
          # Hermes is the expensive one -- 400 objects, sixteen minutes here --
          # and it changes only when React Native's Hermes pin does.
          path: third_party
          key: third-party-${{ runner.os }}-${{ hashFiles('packages/react-native-basalt/native/bootstrap.sh') }}-${{ steps.pin.outputs.ref }}
          # The fallback is what stops an edit to bootstrap.sh costing a Hermes
          # rebuild, which it used to: the exact key still misses, the last
          # third_party comes back anyway, and bootstrap.sh decides what in it
          # is stale. It already stamps both halves -- Hermes with its version,
          # codegen with React Native's -- and rebuilds only the one whose stamp
          # disagrees, so a different pin restoring here is also safe.
          #
          # What no stamp can see is a change to *how* Hermes is built: a new
          # flag or patch in bootstrap.sh, same version. release.yml bootstraps
          # from nothing for exactly that reason, so a stale tree here is caught
          # before anything ships.
          restore-keys: third-party-${{ runner.os }}-

      - name: Restore ccache
        if: ${{ !inputs.cold }}
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: ccache-${{ runner.os }}-

      - name: Bootstrap
        id: bootstrap
        run: |
          ccache --zero-stats
          BUILD_JOBS=$(nproc) scripts/bootstrap.sh react-native-src
          # A run that rebuilds Hermes is a run whose cache key is wrong, and
          # the only symptom otherwise is that CI is slow.
          du -sh third_party react-native-src/node_modules

      # Saves name their key outright rather than reading the restore step's
      # cache-primary-key output: in release.yml's cold run the restore is
      # skipped, its outputs are empty, and a save with an empty key fails.
      - name: Save third_party
        if: steps.bootstrap.outcome == 'success' && steps.third-party.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: third_party
          key: third-party-${{ runner.os }}-${{ hashFiles('packages/react-native-basalt/native/bootstrap.sh') }}-${{ steps.pin.outputs.ref }}

      - name: Save React Native's node_modules
        if: steps.bootstrap.outcome == 'success' && steps.node-modules.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: react-native-src/node_modules
          key: rn-node-modules-${{ runner.os }}-${{ steps.pin.outputs.ref }}

      - name: Configure
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DRN_DIR=react-native-src/packages/react-native

      - name: Build
        id: build
        run: |
          cmake --build build -j "$(nproc)"
          ccache --show-stats
          scripts/check_ccache.py

      - name: Save ccache
        # Even from a build that failed: every object it did compile is still
        # right, and the next run is the one that needs them.
        if: always() && steps.build.outcome != 'skipped'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-${{ github.sha }}

      - name: Start a display
        # Both suites need one. No window manager is involved: the tests map
        # their own windows, and gtk_widget_pick only needs mapped, not managed.
        run: |
          # Redirected and disowned: a step that leaves a process holding its
          # stdout open can make the runner wait for it forever.
          Xvfb :99 -screen 0 1400x1000x24 > /tmp/xvfb.log 2>&1 &
          disown
          for _ in $(seq 1 30); do xdpyinfo -display :99 >/dev/null 2>&1 && break; sleep 0.5; done
          xdpyinfo -display :99 | grep -m1 dimensions

      - name: Unit tests
        run: ./build/basalt_gtk_tests

      - name: Build the JavaScript packages
        # react-native-basalt is TypeScript and `main` points into its dist/,
        # so nothing below can require it until this has run. It is also the
        # type check: `noEmitOnError` is set, so a type that has stopped
        # describing the code fails here rather than misleading a reader.
        run: ./scripts/build_ts.sh

      - name: CLI tests
        # Once per job, not once per shard: these read the same files and
        # give the same answer three times over, and the CLI suite alone is a
        # minute and a half of the saving sharding just bought.
        if: matrix.shard == 1
        # `run-linux`, `run-macos` and `run-windows` are one function with three
        # names, so this checks all three wherever it runs -- which is why the
        # Windows job runs it too. Plus `init`, which is the one command that
        # writes into somebody else's repository.
        run: node --test scripts/test_cli.js

      - name: Platform JavaScript tests
        # Once per job, not once per shard: these read the same files and
        # give the same answer three times over, and the CLI suite alone is a
        # minute and a half of the saving sharding just bought.
        if: matrix.shard == 1
        # react-native-basalt's JavaScript that needs no React Native to run --
        # today, the title bar's request stack. Plain Node, like the CLI tests,
        # and once: it cannot answer differently on another platform.
        run: node --test scripts/test_platform_js.js

      - name: The harness's own checks
        # Shard arithmetic -- that every scenario lands in exactly one shard, for
        # every shard count -- and the waits the scenarios are built out of.
        # Cheap, host-independent, and both guard bugs that point towards green:
        # a boundary that dropped a scenario would make the suite pass while
        # running less of it, and a wait that cannot fail reports the thing it
        # was watching for as having happened. One of each has already been
        # found, so neither is hypothetical.
        if: matrix.shard == 1
        run: |
          python3 scripts/test_shards.py
          python3 scripts/test_harness.py
          python3 scripts/test_ci_status.py

      - name: Include hygiene
        # Once per job, not once per shard: these read the same files and
        # give the same answer three times over, and the CLI suite alone is a
        # minute and a half of the saving sharding just bought.
        if: matrix.shard == 1
        # Here only. It reads text, so it cannot answer differently on another
        # platform, and running it twice would be the same answer twice. What
        # it guards against is platform-shaped all the same: a header reaching
        # <cstdint> through windows.h took this job down for twenty-three
        # commits, and nobody developing on Windows could see it. See the file.
        run: node scripts/check_includes.js

      - name: Bundle the demo
        run: scripts/bundle.sh react-native-src --prod

      - name: End-to-end tests
        # xdotool is installed, so this runs in `real` input mode: the pointer
        # events go through the X server and GDK rather than being injected past
        # them. That is the mode macOS cannot manage.
        #
        # RN_DIR is for the Fast Refresh scenario, which starts its own Metro:
        # scripts/metro.sh looks for a React Native checkout beside the repo,
        # and CI puts it inside the workspace instead.
        env:
          RN_DIR: react-native-src
          # The Fast Refresh scenario does not run here, and the reason is not
          # this repo. Metro on a GitHub runner never notices an edit: the file
          # changes on disk with a new mtime, and a freshly requested bundle
          # still carries the old text, with nothing in Metro's log. What was
          # ruled out first, so the next person does not repeat it: fs.watch
          # sees the same edit on the same runner, the inotify limits are
          # already 655360 and 1280, both sides run Node 24.20.0, and CI's
          # layout with React Native inside the checkout reproduces green in a
          # local VM.
          #
          # Watchman was the standing theory and it is now ruled out too. With
          # the upstream build installed -- not Ubuntu's 4.9.0 from 2017, which
          # would have proved nothing -- `watchman watch-project js` reported
          # `"watcher": "inotify"` over exactly the root Metro was given, a
          # .watchmanconfig was in place, and the scenario failed the same way.
          # `serves_edit` answered *no*, so Metro had not seen the change at
          # all. See docs/BACKLOG.md for what is left to try.
          #
          # It runs on developer machines, on macOS and on Linux, where it
          # passes.
          #
          # This drops the edit, not the scenario: everything before it is the
          # host's own dev-mode code and works here. See docs/TESTING.md.
          BASALT_SKIP_FAST_REFRESH: "1"
        run: scripts/integration_test.py --shard ${{ matrix.shard }}/3

      - name: Save the widget tree on failure
        if: failure()
        # Two minutes, and only when there is something to run.
        #
        # This starts the host against the demo bundle, and "Bundle the demo" is
        # a *later* step -- so a failure before it, such as a unit test, leaves
        # no bundle for this to load. The host then waits rather than quitting,
        # `|| true` never gets its turn, and BASALT_QUIT_AFTER_MS never arms,
        # because none of that is reached until a bundle has loaded. Three jobs
        # sat in this step for fifty minutes after a one-line test failure, which
        # is how it was found: a diagnostic that only runs when something is
        # already wrong is a diagnostic nobody watches.
        timeout-minutes: 2
        run: |
          if [ ! -f build/main.jsbundle.js ]; then
            echo "no demo bundle, so nothing to dump: the run failed before it was built"
            exit 0
          fi
          BASALT_DUMP_TREE="$PWD/widget-tree.txt" BASALT_QUIT_AFTER_MS=6000 \
            ./build/basalt_gtk build/main.jsbundle.js BasaltDemo || true

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: widget-tree
          path: widget-tree.txt
          if-no-files-found: ignore

  macos:
    name: the AppKit host (shard ${{ matrix.shard }})
    runs-on: macos-15
    timeout-minutes: 120
    strategy:
      # Three, as on Linux, and this job has a second thing to split: the
      # cross-host comparison is another nine minutes over eighteen
      # independent apps. Both shard on the same index, so each shard runs a
      # third of each.
      #
      # This said the build was five and a half minutes and that each shard
      # paid it again, which was true and was a bug rather than a fact: see
      # Configure and build. Measured since, warm: the build is 29 seconds, the
      # job 9.8 minutes against 27.7 unsharded, and what does not shard is 128
      # seconds rather than 434 -- so `128s + 1380s/N`, and a fourth shard is
      # worth about two minutes. Five is the ceiling and not because of
      # diminishing returns: a Free or Pro account gets five concurrent macOS
      # jobs, so six run in two waves and finish slower than three, and five
      # leaves nothing for release.yml, which also wants a Mac.
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      # This workflow's top-level env is written for the Linux jobs: an Xvfb
      # display at :99 and GTK's x11 backend. Neither exists on a Mac, and
      # inheriting them is not harmless -- GTK honours GDK_BACKEND, fails to
      # open a display, and every host it starts produces an empty tree. The
      # first run of this job reported all eighteen apps disagreeing, which
      # is what a comparison says when one side never rendered.
      #
      # ccache's directory named rather than assumed. Its default differs
      # between platforms and versions -- ~/.cache/ccache on Linux,
      # ~/Library/Caches/ccache on some Mac builds -- and this job cached a path
      # ccache was not writing to for as long as it existed: a 0-second restore,
      # a 0-second save, and a full six-minute compile every run.
      CCACHE_DIR: ${{ github.workspace }}/ccache
      # The same bound the Windows job explains: a repository gets 10GB of cache
      # in all and the oldest entry is evicted first, so an unbounded ccache
      # would push out third_party and node_modules, which cost more to replace.
      CCACHE_MAXSIZE: 2G
      #
      # `macos` and not `quartz`: GTK 4 renamed that backend, and GTK 3's name
      # matches nothing compiled in -- which fails exactly like inheriting
      # x11 does, silently and with every app reported as disagreeing.
      # Checked by running compare_all.sh with each spelling on a Mac: x11
      # and quartz both give 18 of 18 disagreeing, macos gives 18 of 18
      # agreeing. Homebrew's GTK having a macOS backend at all is what makes
      # this comparison possible on one runner.
      GDK_BACKEND: macos
      # Emptied rather than left at :99. Nothing on a Mac reads it, and a
      # display number that does not exist is worse than none.
      DISPLAY: ""
    # Here rather than only in release.yml as of the day this repository went
    # public. It lived there because macOS minutes bill at ten times Linux's
    # and that was worth avoiding on a private repository; standard runners
    # are free on a public one, so the reason expired.
    #
    # What that cost, before it expired: AppKit was the one first-class host
    # with no per-push check, and the first time release.yml ran it found a
    # scenario that had never passed on macOS -- LogBox's toast is at a
    # different height there, and the tap that found it on Linux missed. That
    # is the bug class this job exists to catch on the commit that causes it.
    #
    # GTK is installed as well as AppKit, for two reasons: bootstrap.sh checks
    # for gtk4 on every platform that is not Windows, and a Mac with both is
    # the one machine that can run compare_all.sh without WSL.
    steps:
      - uses: actions/checkout@v7

      - name: Read the React Native pin
        id: pin
        run: echo "ref=$(grep -v '^#' scripts/react-native.pin | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: |
          brew install gtk4 pango glib glog boost fmt double-conversion gflags \
            openssl cmake ninja pkg-config ccache

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Fetch React Native at the pinned release
        run: |
          mkdir -p react-native-src && cd react-native-src
          git init -q
          git remote add origin https://github.com/react/react-native
          git fetch -q --depth 1 origin refs/tags/${{ steps.pin.outputs.ref }}
          git checkout -q FETCH_HEAD

      - name: Restore React Native's node_modules
        id: node-modules
        if: ${{ !inputs.cold }}
        uses: actions/cache/restore@v6
        with:
          path: react-native-src/node_modules
          key: rn-node-modules-${{ runner.os }}-${{ steps.pin.outputs.ref }}

      - name: Restore third_party
        id: third-party
        if: ${{ !inputs.cold }}
        uses: actions/cache/restore@v6
        with:
          # Hermes, as on Linux, and the same reasoning about the fallback key
          # applies -- see the Linux job above.
          path: third_party
          key: third-party-${{ runner.os }}-${{ hashFiles('packages/react-native-basalt/native/bootstrap.sh') }}-${{ steps.pin.outputs.ref }}
          restore-keys: third-party-${{ runner.os }}-

      - name: Restore ccache
        if: ${{ !inputs.cold }}
        uses: actions/cache/restore@v6
        with:
          path: ${{ github.workspace }}/ccache
          key: ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: ccache-${{ runner.os }}-

      - name: Bootstrap
        id: bootstrap
        run: BUILD_JOBS=$(sysctl -n hw.ncpu) scripts/bootstrap.sh react-native-src

      - name: Save third_party
        if: steps.bootstrap.outcome == 'success' && steps.third-party.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: third_party
          key: third-party-${{ runner.os }}-${{ hashFiles('packages/react-native-basalt/native/bootstrap.sh') }}-${{ steps.pin.outputs.ref }}

      - name: Save React Native's node_modules
        if: steps.bootstrap.outcome == 'success' && steps.node-modules.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: react-native-src/node_modules
          key: rn-node-modules-${{ runner.os }}-${{ steps.pin.outputs.ref }}

      - name: Configure and build
        # The two LAUNCHER flags are the point. This job installed ccache,
        # restored a ccache and saved a ccache, but never told CMake to use one
        # -- it was carried over from release.yml, where a release build wants a
        # cold compiler -- so the compile cost 5.9 of this job's 15 minutes on
        # every run, while the same build on Linux took 14 seconds. Nothing
        # failed, and the cache steps reported success both ways: a cache that
        # is never written restores in 0 seconds and saves in 0 seconds.
        run: |
          ccache --zero-stats
          cmake -B build -G Ninja -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DRN_DIR=react-native-src/packages/react-native
          cmake --build build -j "$(sysctl -n hw.ncpu)"
          ccache --show-stats
          python3 scripts/check_ccache.py

      - name: Save ccache
        if: always()
        uses: actions/cache/save@v6
        with:
          path: ${{ github.workspace }}/ccache
          key: ccache-${{ runner.os }}-${{ github.sha }}

      - name: Unit tests
        # Needs neither a display nor a window: nothing in it is presented.
        run: ./build/basalt_appkit_tests

      - name: Build the JavaScript packages
        run: ./scripts/build_ts.sh

      - name: CLI tests
        # Once per job, not once per shard: these read the same files and
        # give the same answer three times over, and the CLI suite alone is a
        # minute and a half of the saving sharding just bought.
        if: matrix.shard == 1
        run: node --test scripts/test_cli.js


      - name: Bundle the demo
        run: scripts/bundle.sh react-native-src --prod --platform macos

      - name: End-to-end tests
        env:
          # Drops the Fast Refresh *edit*, for the reason the Linux job spells
          # out: Metro on a GitHub runner never notices a file change. The rest
          # of that scenario -- dev mode, the dev server helper, the websocket,
          # DevSettings, and a bundle served by Metro rather than read off disk
          # -- runs here. See docs/TESTING.md.
          BASALT_SKIP_FAST_REFRESH: "1"
        run: python3 scripts/integration_test.py --platform macos --shard ${{ matrix.shard }}/3

      - name: GTK and AppKit, compared
        # Every app in js/, through both hosts on this one runner -- the check
        # that the two desktops still produce the same tree, which no other
        # job can make because no other has both.
        env:
          BASALT_COMPARE_SHARD: ${{ matrix.shard }}/3
        run: scripts/compare_all.sh

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: widget-tree-macos
          path: widget-tree.txt
          if-no-files-found: ignore

  windows-full:
    name: the whole Windows stack (shard ${{ matrix.shard }})
    # GitHub's image unless a repository variable names something else.
    #
    # `WINDOWS_RUNNER` set to a self-hosted runner's label sends this job to that
    # machine; unset, it goes back to GitHub's with no other change. A variable
    # rather than hard-coding a label, because a self-hosted runner that is
    # switched off does not fail a job -- it queues it, for six hours, and the
    # run that never reports looks exactly like the run that is still going.
    # Unsetting one variable is a fix anyone can make from a phone.
    #
    # See docs/TESTING.md for what such a machine needs and how to enrol one.
    runs-on: ${{ vars.WINDOWS_RUNNER || 'windows-2022' }}
    timeout-minutes: 150
    strategy:
      # The end-to-end suite is nine of this job's thirteen minutes, and every
      # scenario is an independent host process -- so it splits. Three shards
      # rather than more because the rest of the job is fixed cost that each
      # shard pays again: the build is nearly free with ccache, but installing
      # dependencies and bootstrapping are not, and past three the repeated
      # overhead grows faster than the saving.
      #
      # fail-fast off, so one shard failing still lets the others report. A
      # sharded suite where the first failure hides the rest is worse for
      # diagnosis than an unsharded one.
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    # vcpkg, a React Native checkout, Hermes built from source, React Native's
    # C++ core under clang-cl, the host, every Windows test and the end-to-end
    # suite.
    #
    # There used to be a second, smaller Windows job beside this one that built
    # the view layer alone with MSBuild in two minutes, so a broken view layer
    # was reported before this one had restored its caches. Warm, this one is
    # not much slower, runs every test that one ran and 90 more, so it went.
    # Its demo snapshot moved here; its MSBuild build moved to release.yml.
    #
    # It is the Linux job's shape on purpose, step for step, so that a reader
    # who knows one knows the other. What differs is what Windows needs that
    # apt would otherwise supply, and the traps below that each cost a run to
    # find.

    env:
      CCACHE_DIR: ${{ github.workspace }}\ccache
      # With debug info embedded in every object (see Configure) the objects are
      # large, and GitHub gives a repository 10GB of cache in all, evicting the
      # oldest entry first. A ccache that grew without bound would push out the
      # vcpkg and Hermes caches, which are the ones that cost twenty minutes to
      # replace rather than two.
      CCACHE_MAXSIZE: 2G

    steps:
      - uses: actions/checkout@v7

      - name: Read the React Native pin
        id: pin
        shell: bash
        run: echo "ref=$(grep -v '^#' scripts/react-native.pin | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: The MSVC environment, for every later step
        # clang-cl needs the Windows SDK's headers and libraries on INCLUDE and
        # LIB, and those come from vcvars64.bat -- which sets them in the shell
        # that runs it and nowhere else. So this runs it once and hands every
        # variable it *changed* to $GITHUB_ENV, rather than every variable: a
        # plain dump would rewrite the runner's own settings too.
        #
        # No third-party action for this: one less thing on the runner image
        # to depend on.
        #
        # **VCPKG_ROOT is put back afterwards.** vcvars64.bat sets it to the copy
        # of vcpkg bundled with Visual Studio, which has nothing installed in it.
        # bootstrap.sh knows this and looks for a header rather than trusting the
        # variable; CMake's toolchain file does not.
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
            -latest -products * -requires Microsoft.VisualStudio.Component.VC.Llvm.Clang `
            -property installationPath
          if (-not $vs) { throw "no Visual Studio with clang-cl on this runner" }

          $before = @{}
          Get-ChildItem Env: | ForEach-Object { $before[$_.Name] = $_.Value }

          cmd /c "`"$vs\VC\Auxiliary\Build\vcvars64.bat`" >nul 2>&1 && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') {
              $name = $matches[1]; $value = $matches[2]
              if ($before[$name] -ne $value -and $name -ne 'VCPKG_ROOT') {
                "$name=$value" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
              }
            }
          }

          $vcpkg = $env:VCPKG_INSTALLATION_ROOT
          if (-not (Test-Path "$vcpkg\scripts\buildsystems\vcpkg.cmake")) {
            throw "no vcpkg at VCPKG_INSTALLATION_ROOT ($vcpkg)"
          }
          "VCPKG_ROOT=$vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: ccache
        # Linux gets it from apt; the Windows image does not have it. A pinned
        # release, checked against its hash, rather than a package manager or an
        # action -- the same reason as the step above.
        shell: pwsh
        run: |
          $version = "4.14"
          $expected = "2568347a697e103ca1b073981c704ad76fb2507d066c38dba038dd73399d968f"
          $zip = "$env:RUNNER_TEMP\ccache.zip"
          Invoke-WebRequest "https://github.com/ccache/ccache/releases/download/v$version/ccache-$version-windows-x86_64.zip" -OutFile $zip
          $actual = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $expected) { throw "ccache download hash $actual, expected $expected" }
          Expand-Archive $zip -DestinationPath "$env:RUNNER_TEMP\ccache"
          "$env:RUNNER_TEMP\ccache\ccache-$version-windows-x86_64" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Restore vcpkg's binaries
        id: vcpkg-cache
        # Restored even for a cold run, unlike every other cache here. What
        # `cold` is guarding against is a build artefact that is stale in a way
        # no key can see -- a Hermes carrying last month's flags -- and this
        # cache holds none of ours: glog, fmt, double-conversion, boost,
        # openssl and curl, all third party and all built by vcpkg. It is also
        # addressed by vcpkg's ABI hash, which includes the compiler, so a
        # stale entry misses rather than applying quietly.
        #
        # Worth the exception because it was the single most expensive step in
        # a release: 12.2 minutes of the Windows shard's 37.6, rebuilding
        # boost and openssl to prove nothing about this project.
        uses: actions/cache/restore@v6
        with:
          # vcpkg's own binary cache rather than its `installed` tree. The tree
          # is what vcpkg decides from, and restoring one it did not write is
          # how a cache hit turns into a rebuild anyway; the binary cache is
          # meant to be carried between machines.
          #
          # A new key per run, found by prefix. vcpkg's cache is addressed by
          # ABI hash, which includes the compiler, so a runner image update
          # makes every entry miss -- and a fixed key would then be a permanent
          # hit on a cache that no longer contains anything usable, never saved
          # again, rebuilding every package on every run.
          path: ${{ github.workspace }}\vcpkg-binaries
          key: vcpkg-${{ runner.os }}-${{ github.run_id }}
          restore-keys: vcpkg-${{ runner.os }}-

      - name: Install what Linux gets from apt
        id: vcpkg
        # The list bootstrap.sh prints when they are missing, which is also the
        # list in the README. boost-thread is not on React Native's own list and
        # is needed anyway: folly's Windows PThread.cpp shim is written over it.
        shell: pwsh
        env:
          VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}\vcpkg-binaries,readwrite
        run: |
          $cache = "${{ github.workspace }}\vcpkg-binaries"
          New-Item -ItemType Directory -Force $cache | Out-Null
          $before = (Get-ChildItem $cache -Recurse -File).Count
          & "$env:VCPKG_ROOT\vcpkg.exe" install --triplet x64-windows `
            glog fmt double-conversion boost-regex boost-beast boost-asio boost-thread openssl curl
          if ($LASTEXITCODE -ne 0) { throw "vcpkg install failed" }
          # Saved only when something was built, which is what put new files
          # in the cache. Uploading an unchanged cache on every run is time
          # spent for nothing.
          $after = (Get-ChildItem $cache -Recurse -File).Count
          "built=$($after -gt $before)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "vcpkg binary cache: $before files before, $after after"

      - name: Save vcpkg's binaries
        if: steps.vcpkg.outputs.built == 'True'
        uses: actions/cache/save@v6
        with:
          path: ${{ github.workspace }}\vcpkg-binaries
          key: vcpkg-${{ runner.os }}-${{ github.run_id }}

      - name: Fetch React Native at the pinned release
        shell: bash
        run: |
          mkdir -p react-native-src && cd react-native-src
          git init -q
          git remote add origin https://github.com/react/react-native
          git fetch -q --depth 1 origin refs/tags/${{ steps.pin.outputs.ref }}
          git checkout -q FETCH_HEAD
          git log --oneline -1

      - name: Restore React Native's node_modules
        id: node-modules
        if: ${{ !inputs.cold }}
        uses: actions/cache/restore@v6
        with:
          path: react-native-src/node_modules
          key: rn-node-modules-${{ runner.os }}-${{ steps.pin.outputs.ref }}

      - name: Restore third_party
        id: third-party
        if: ${{ !inputs.cold }}
        uses: actions/cache/restore@v6
        with:
          # Keyed as the Linux job keys it, with the OS in front: Hermes built
          # with clang-cl is not Hermes built with clang, and a key that did not
          # say so would restore the wrong one. The fallback is explained there.
          path: third_party
          key: third-party-${{ runner.os }}-${{ hashFiles('packages/react-native-basalt/native/bootstrap.sh') }}-${{ steps.pin.outputs.ref }}
          restore-keys: third-party-${{ runner.os }}-

      - name: Restore ccache
        if: ${{ !inputs.cold }}
        uses: actions/cache/restore@v6
        with:
          path: ${{ github.workspace }}\ccache
          key: ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: ccache-${{ runner.os }}-

      - name: Bootstrap
        id: bootstrap
        # From Git Bash, which is what bootstrap.sh detects and expects, and
        # which inherits the MSVC environment the step above exported.
        #
        # The first time this ran from an empty third_party it found that Git
        # Bash rewrites Hermes' `/DWIN32` into `C:/Program Files/Git/DWIN32`.
        # See bootstrap.sh.
        shell: bash
        run: |
          BUILD_JOBS=$(nproc) scripts/bootstrap.sh react-native-src
          du -sh third_party react-native-src/node_modules

      - name: Save third_party
        if: steps.bootstrap.outcome == 'success' && steps.third-party.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: third_party
          key: third-party-${{ runner.os }}-${{ hashFiles('packages/react-native-basalt/native/bootstrap.sh') }}-${{ steps.pin.outputs.ref }}

      - name: Save React Native's node_modules
        if: steps.bootstrap.outcome == 'success' && steps.node-modules.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: react-native-src/node_modules
          key: rn-node-modules-${{ runner.os }}-${{ steps.pin.outputs.ref }}

      - name: Configure
        # CMAKE_BUILD_TYPE is not optional here, unlike on the other two
        # desktops. Left unset, MSVC picks the debug C runtime and vcpkg follows
        # it to the debug packages, while Hermes was built Release; lld-link
        # then reports a mismatch on _ITERATOR_DEBUG_LEVEL that names neither.
        #
        # **Debug info goes in the object, not a shared PDB.** RelWithDebInfo
        # means /Zi, where every compile in a target writes into one .pdb, and
        # ccache cannot cache a compile whose output is half of a shared file.
        # /Z7 puts it in the .obj. CMake only honours the setting under policy
        # CMP0141, which this project's cmake_minimum_required predates, hence
        # the policy default; checked locally, it leaves no /Zi in any of the
        # 463 compiles, React Native's included.
        shell: pwsh
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo `
            -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl `
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache `
            -DCMAKE_POLICY_DEFAULT_CMP0141=NEW -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded `
            "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DRN_DIR=react-native-src/packages/react-native
          if ($LASTEXITCODE -ne 0) { throw "configure failed" }

      - name: Build
        id: build
        shell: pwsh
        run: |
          ccache --zero-stats | Out-Null
          cmake --build build -j $env:NUMBER_OF_PROCESSORS
          $status = $LASTEXITCODE
          ccache --show-stats
          if ($status -ne 0) { throw "build failed" }
          python scripts/check_ccache.py
          if ($LASTEXITCODE -ne 0) { throw "ccache was not in the compile" }

      - name: Save ccache
        if: always() && steps.build.outcome != 'skipped'
        uses: actions/cache/save@v6
        with:
          path: ${{ github.workspace }}\ccache
          key: ccache-${{ runner.os }}-${{ github.sha }}

      - name: Unit tests
        # All of them: the view layer's and the half that needs React Native.
        shell: pwsh
        run: |
          ./build/basalt_win32_tests.exe
          if ($LASTEXITCODE -ne 0) { throw "unit tests failed" }

      - name: Build the JavaScript packages
        # As on Linux, and for the same reason: the tests below require the
        # built output. Also the type check -- and worth running on both, since
        # a path separator is the kind of thing that types will not catch and
        # only one of the two runners can.
        shell: bash
        run: ./scripts/build_ts.sh

      - name: CLI tests
        # Once per job, not once per shard: these read the same files and
        # give the same answer three times over, and the CLI suite alone is a
        # minute and a half of the saving sharding just bought.
        if: matrix.shard == 1
        # The same three commands the Linux job checks. Here for the half that
        # only Windows can be wrong about: `basalt_win32.exe` carries an
        # extension, and `isExecutable` has to answer a different question on a
        # filesystem with no executable bit.
        run: node --test scripts/test_cli.js

      - name: The demo's tree, and its picture
        # Both modes of demo_layout_win32, because they fail differently: the
        # dump would look identical whether or not anything painted, and the
        # snapshot is what says pixels came out.
        shell: pwsh
        run: |
          $env:BASALT_DUMP_TREE = "1"
          ./build/demo_layout_win32.exe
          if ($LASTEXITCODE -ne 0) { throw "demo_layout_win32 failed" }
          Remove-Item Env:\BASALT_DUMP_TREE
          $env:BASALT_SNAPSHOT = "$PWD/demo-win32.png"
          ./build/demo_layout_win32.exe
          if (-not (Test-Path "$PWD/demo-win32.png")) { throw "no snapshot was written" }

      - uses: actions/upload-artifact@v7
        with:
          name: demo-win32
          path: demo-win32.png
          if-no-files-found: error

      - name: Bundle the demo
        shell: bash
        run: scripts/bundle.sh react-native-src --prod --platform windows

      - name: End-to-end tests
        # All but Fast Refresh, which needs scripts/metro.sh to stay running
        # and would be skipped here even without the flag.
        # Input is injected -- SendInput would move the runner's real cursor --
        # which is the mode integration_test.py picks on its own.
        shell: pwsh
        env:
          # For the two scenarios that bundle an app of their own -- hover and
          # pointerEvents, both about input the demo has nothing listening for.
          # scripts/bundle.sh looks for a React Native checkout beside the repo,
          # and CI puts it inside the workspace instead.
          RN_DIR: react-native-src
          # Drops the Fast Refresh *edit*, for the reason the Linux job spells
          # out. Everything before the edit now runs on Windows too: the
          # packager starts through scripts/metro.js rather than a shell script,
          # which is what used to skip this scenario and the developer menu one
          # here outright. See docs/TESTING.md.
          BASALT_SKIP_FAST_REFRESH: "1"
        run: |
          python scripts/integration_test.py --platform windows --shard ${{ matrix.shard }}/3
          if ($LASTEXITCODE -ne 0) { throw "end-to-end tests failed" }

  drift:
    name: build against React Native main
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    # Monday's schedule only, or by hand. It is a second full build with no
    # cache, and on a private repo that is real money.
    if: github.event.schedule == '17 6 * * 1' || inputs.drift
    # Upstream moving is not this repo regressing, so this must never block a
    # pull request. It exists to notice API churn in ReactCxxPlatform, which
    # carries no stability guarantee, before it piles up.
    continue-on-error: true

    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            build-essential clang cmake ninja-build pkg-config ccache \
            libgtk-4-dev libpango1.0-dev libglib2.0-dev \
            libgoogle-glog-dev libboost-dev libboost-regex-dev libfmt-dev \
            libdouble-conversion-dev libgflags-dev libssl-dev libcurl4-openssl-dev \
            libgl1-mesa-dri xvfb xdotool x11-utils

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Clone React Native main
        run: |
          git clone -q --depth 1 https://github.com/react/react-native react-native-src
          git -C react-native-src log --oneline -1

      - name: Bootstrap, build and test
        # RN_DIR points into the clone above. It used to say
        # ../react-native/packages/react-native -- a path that exists on a
        # developer's machine and not on a runner -- and continue-on-error meant
        # nobody would ever have seen it fail.
        run: |
          BUILD_JOBS=$(nproc) scripts/bootstrap.sh react-native-src
          cmake -B build -G Ninja \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DRN_DIR=react-native-src/packages/react-native
          cmake --build build -j "$(nproc)"
          Xvfb :99 -screen 0 1400x1000x24 > /tmp/xvfb.log 2>&1 &
          disown
          for _ in $(seq 1 30); do xdpyinfo -display :99 >/dev/null 2>&1 && break; sleep 0.5; done
          ./build/basalt_gtk_tests
          scripts/bundle.sh react-native-src --prod
          RN_DIR=react-native-src scripts/integration_test.py
