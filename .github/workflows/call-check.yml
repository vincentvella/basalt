name: Call check
# Temporary. Runs publish.yml's trust probe through `uses:`, the way release.yml
# reaches it, to see whether npm matches the calling workflow or the called one.
on: workflow_dispatch
jobs:
  called:
    permissions:
      id-token: write
      contents: read
      actions: read
    uses: ./.github/workflows/publish.yml
    with:
      run-id: "36735594087"
      check-only: true
