name: Docs

# The inverse of ci.yml's paths-ignore. That workflow skips prose because prose
# needs no compiler; this one exists so prose is not therefore unchecked. It
# builds the site, which is what catches a broken link, a sidebar naming a page
# that does not exist, or markdown that MDX cannot parse.
#
# Since 2026-10-08 this is the only thing that builds the site on a push:
# `website/vercel.json` turns the git integration's deploys off for main, so the
# site ships when somebody asks for it rather than twenty times a day. See the
# measurement in docs/ci-performance.md and the how in website/README.md.
#
# ## The paths are what the site renders, which is not all the prose
#
# `docusaurus.config.ts` takes `../docs` and *excludes* `BACKLOG.md`,
# `backlog/**` and `ci-performance.md`, so a commit touching only those rebuilds
# an identical site. They were in this filter and they are the commits this
# repository mostly makes: 18 of 20 one day ran this job for nothing. The
# negations below say so, and a commit that touches an excluded file *and* a
# rendered one still matches, which is what the trailing entries are for.

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "docs/**"
      - "!docs/BACKLOG.md"
      - "!docs/backlog/**"
      - "!docs/ci-performance.md"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "website/**"
      - "docs/**"
      - "!docs/BACKLOG.md"
      - "!docs/backlog/**"
      - "!docs/ci-performance.md"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    name: the site builds
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install
        working-directory: website
        run: npm ci

      - name: Build
        working-directory: website
        # The repository's own docs are read in place from ../docs, so this
        # fails when a commit breaks one of those too -- which is the point.
        run: npm run build

      - name: Typecheck
        working-directory: website
        run: npm run typecheck
