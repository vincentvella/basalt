name: Docs

# The inverse of ci.yml's paths-ignore. That workflow skips prose because prose
# needs no compiler; this one exists so prose is not therefore unchecked. It
# builds the site, which is what catches a broken link, a sidebar naming a page
# that does not exist, or markdown that MDX cannot parse.
#
# Vercel builds and deploys the site itself. This is only the check, so that a
# commit that breaks the build says so on the commit rather than in a failed
# deployment nobody is watching.

on:
  push:
    branches: [main]
    paths: ["website/**", "docs/**", "**/*.md", ".github/workflows/docs.yml"]
  pull_request:
    paths: ["website/**", "docs/**", "**/*.md", ".github/workflows/docs.yml"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    name: the site builds
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install
        working-directory: website
        run: npm ci

      - name: Build
        working-directory: website
        # The repository's own docs are read in place from ../docs, so this
        # fails when a commit breaks one of those too -- which is the point.
        run: npm run build

      - name: Typecheck
        working-directory: website
        run: npm run typecheck
