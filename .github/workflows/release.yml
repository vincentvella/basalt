name: Release

# What has to be true before a version is published, and is too slow or too
# expensive to ask on every push. ci.yml is the every-push half.
#
# The question here is different from CI's. CI asks whether this checkout
# builds and passes. A release has to answer whether *somebody else's app* gets
# a working desktop from `npm install` -- an Expo app, from tarballs, with none
# of this repository's scaffolding around it -- and whether everything still
# builds from nothing, with no cache to hide a stale Hermes behind.
#
# The last job publishes, over trusted publishing: GitHub mints an OIDC token,
# npm exchanges it for a short-lived one scoped to this workflow, and provenance
# is attached automatically. There is no NPM_TOKEN in this repository and
# nothing long-lived to leak. It runs for a tag and not for a hand-started run,
# so the questions below can still be asked without publishing an answer.
#
# Run by pushing a tag (`git tag v0.1.0 && git push origin v0.1.0`), or by hand
# from the Actions tab, which skips the version check and runs everything else.
#
# macOS used to be defined here rather than in ci.yml, because macOS minutes
# bill at ten times Linux's and that was worth avoiding on a private
# repository. Standard runners are free on a public one, so it moved to
# ci.yml and runs on every push; the cold build below calls that workflow and
# gets it too, which is the same job at a second cadence rather than a second
# copy of it.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# No concurrency group. ci.yml, called below, has its own, and a caller and
# callee that share one name cancel each other.

jobs:
  versions:
    name: every package carries the tag's version
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v7

      - name: Compare
        # All four at once, and the platform packages' dependency on the shared
        # one too: a gtk package at 0.2.0 that asks for react-native-basalt
        # 0.1.0 installs, and runs against the wrong core.
        run: |
          node - "${GITHUB_REF_NAME#v}" <<'EOF'
          const fs = require('fs');
          const want = process.argv[2];
          const problems = [];
          for (const dir of fs.readdirSync('packages')) {
            const manifest = JSON.parse(fs.readFileSync(`packages/${dir}/package.json`, 'utf8'));
            if (manifest.version !== want) {
              problems.push(`${manifest.name} is ${manifest.version}`);
            }
            const core = manifest.dependencies?.['react-native-basalt'];
            if (core !== undefined && core !== want) {
              problems.push(`${manifest.name} depends on react-native-basalt ${core}`);
            }
          }
          if (problems.length) {
            console.error(`the tag says ${want}, but:\n  ${problems.join('\n  ')}`);
            process.exit(1);
          }
          console.log(`all packages at ${want}`);
          EOF

  from-nothing:
    name: every host, from nothing
    # ci.yml itself, with every cache restore skipped. The every-push run
    # restores third_party by prefix and trusts bootstrap.sh's version stamps to
    # notice a stale one, which cannot see a change to *how* Hermes is built.
    # This is where that trade is paid back.
    uses: ./.github/workflows/ci.yml
    with:
      cold: true

  msbuild:
    name: the Windows view layer, with MSBuild
    runs-on: windows-2022
    timeout-minutes: 20
    # Moved out of ci.yml, where the whole Windows stack now covers everything
    # this built except the generator. Development and CI use Ninja; this is
    # the Visual Studio generator, which is what someone opening the project in
    # Visual Studio gets, and MSBuild finding its own toolchain with no vcvars.
    steps:
      - uses: actions/checkout@v7

      - name: Configure
        run: cmake -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config RelWithDebInfo

      - name: Unit tests
        run: ./build/basalt_win32_tests.exe

  expo-install:
    name: an Expo app, from the packed packages
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    # The release question itself: a fresh `create-expo-app`, these packages
    # installed into it from the tarballs `npm publish` would upload, and
    # `react-native run-linux --build` doing what an app developer would do.
    # Nothing from this checkout is on the path except the tarballs.
    #
    # Linux because Linux is the target; the same test on macOS and Windows is
    # worth adding once this one passes.
    #
    # Writing this job found three reasons it could not pass, all in
    # `--build`, and all fixed before it first ran: the command refused an
    # installed react-native and demanded a source checkout, long after
    # bootstrap and CMake had learned to build from one; it never passed
    # -DBASALT_EXPO_MODULES_CORE, so the host had no Expo runtime; and it named
    # no compiler, so Ubuntu's g++ met React Native's -Werror. The same steps
    # passed in WSL on Ubuntu 24.04 before this was committed.
    #
    # Nothing here tells the app anything an app developer would not do.
    # That is the point: this job is green because installing works, not
    # because it was shown how.
    env:
      DISPLAY: ":99"
      GDK_BACKEND: x11
    steps:
      - uses: actions/checkout@v7
        with:
          path: basalt

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            build-essential clang cmake ninja-build pkg-config \
            libgtk-4-dev libpango1.0-dev libglib2.0-dev \
            libgoogle-glog-dev libboost-dev libboost-regex-dev libfmt-dev \
            libdouble-conversion-dev libgflags-dev libssl-dev libcurl4-openssl-dev \
            libgl1-mesa-dri xvfb x11-utils

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Read the React Native pin
        id: pin
        working-directory: basalt
        run: echo "ref=$(grep -v '^#' scripts/react-native.pin | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"

      - name: Fetch React Native at the pinned release
        # Packing runs each package's `prepack`, which typechecks the
        # TypeScript, which needs a React Native to check against and a tsc to
        # do it with. This job otherwise has no checkout of one -- the point of
        # it is an app with nothing from this repository on the path -- so it
        # fetches one solely to build the tarballs, and the app it installs
        # them into still gets React Native from npm like anybody else.
        run: |
          mkdir -p react-native-src && cd react-native-src
          git init -q
          git remote add origin https://github.com/react/react-native
          git fetch -q --depth 1 origin refs/tags/${{ steps.pin.outputs.ref }}
          git checkout -q FETCH_HEAD

      - name: Restore React Native's node_modules
        id: node-modules
        uses: actions/cache/restore@v6
        with:
          path: react-native-src/node_modules
          # The same key ci.yml uses, so this shares that cache rather than
          # paying for its own: a fixed commit has a fixed yarn.lock.
          key: rn-node-modules-${{ runner.os }}-${{ steps.pin.outputs.ref }}

      - name: Install React Native's dependencies
        if: steps.node-modules.outputs.cache-hit != 'true'
        working-directory: react-native-src
        run: yarn install --frozen-lockfile

      - name: Pack
        # Exactly what would be uploaded: `files` in each package.json decides,
        # so a directory missing from it is missing here too.
        run: |
          mkdir tarballs
          for package in basalt/packages/*/; do
            RN_DIR="$GITHUB_WORKSPACE/react-native-src" \
              npm pack "$package" --pack-destination tarballs
          done
          ls -l tarballs

      - name: Keep the tarballs
        # So that `ready to publish` reports on the exact files this job
        # installed and tested, rather than packing its own copies. Packing
        # needs a React Native checkout -- core's `prepack` typechecks -- and
        # that job has none; giving it one would be a third copy of the same
        # three steps to keep in step with the other two.
        uses: actions/upload-artifact@v7
        with:
          name: tarballs
          path: tarballs/
          retention-days: 7

      - name: Create an Expo app
        # SDK 57 installs React Native 0.86, which supported-versions.json lists
        # because it is what a current Expo app gets. Pinned, so this job fails
        # because of this repository and not because Expo released.
        run: npx --yes create-expo-app@latest app --template blank@sdk-57

      - name: Install the packages into it
        # All four in one install, so the platform packages' dependency on
        # react-native-basalt is satisfied by its tarball and not looked up on
        # the registry.
        working-directory: app
        run: npm install ../tarballs/*.tgz

      - name: Configure it, the way the README says to
        # `init` rather than a heredoc of the same three lines. Writing the
        # config here meant the job proved the platform worked and never that
        # the command did -- and the command was broken in two ways that only
        # a real app could show: it read `init` as the directory to configure,
        # and it refused an app with no metro.config.js, which a stock
        # create-expo-app is.
        #
        # It adds the dev dependencies rather than installing them, which is
        # why the install below is separate and not a repeat.
        working-directory: app
        run: |
          npx react-native-basalt init
          npm install

      - name: Check it the way a person would
        # `doctor` is the same checks with writing off, plus the ones `init`
        # cannot fix -- cmake, ninja, GTK's headers, the React Native version.
        # Run here because this is the only job with a real app on a real
        # machine, and because it is what would have caught `init` adding no
        # host packages: every run-<desktop> command was missing and the build
        # step was the first thing to say so.
        working-directory: app
        run: npx react-native-basalt doctor

      - name: Start a display
        run: |
          Xvfb :99 -screen 0 1400x1000x24 > /tmp/xvfb.log 2>&1 &
          disown
          for _ in $(seq 1 30); do xdpyinfo -display :99 >/dev/null 2>&1 && break; sleep 0.5; done

      - name: run-linux --build
        # Expo apps register "main" whatever app.json says. The template's one
        # line of text is what has to come out the other end.
        working-directory: app
        env:
          BASALT_QUIT_AFTER_MS: "15000"
          BASALT_DUMP_TREE: ${{ github.workspace }}/tree.txt
        run: |
          npx react-native run-linux --build --mode release --module main
          cat ../tree.txt
          grep -F "Open up App" ../tree.txt

  ready:
    name: ready to publish
    runs-on: ubuntu-24.04
    needs: [versions, from-nothing, msbuild, expo-install]
    # Runs for a hand-started run too, where `versions` is skipped rather than
    # failed; anything that actually failed still stops it.
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') }}
    steps:
      - uses: actions/checkout@v7

      - name: Collect the tarballs the Expo job installed
        uses: actions/download-artifact@v8
        with:
          name: tarballs
          path: tarballs

      - name: What would be published
        # The actual files, rather than a fresh `npm pack` of each package.
        # This used to re-pack, and failed the first time it ran: core's
        # `prepack` typechecks the TypeScript, which needs a React Native
        # checkout, which a bare runner does not have -- so the four packages
        # without a prepack reported and the fifth killed the job.
        #
        # Reporting on what the Expo job built is better than fixing that by
        # adding a checkout here: these are the bytes that were installed into
        # a real app and run, so the summary describes something that has been
        # tested rather than something packed again at the end.
        #
        # This job stays a summary. Publishing is the job after it, which
        # takes the same artifact, so what is reported here and what is
        # uploaded are the same bytes rather than two packs that agree.
        run: |
          for tarball in tarballs/*.tgz; do
            echo "== $tarball"
            tar -xzOf "$tarball" package/package.json |
              node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{
                const m=JSON.parse(s);
                console.log(`   ${m.name} ${m.version}`);
              })'
            echo "   $(tar -tzf "$tarball" | wc -l) files, $(du -h "$tarball" | cut -f1)"
          done

  publish:
    name: publish to npm
    runs-on: ubuntu-24.04
    needs: [ready]
    # Tags only. `ready` deliberately runs for a hand-started run too, so that
    # the release questions can be asked without one; publishing must not
    # inherit that. A workflow_dispatch run gets everything up to the summary
    # and stops.
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      # The whole credential. Trusted publishing exchanges this OIDC token for
      # a short-lived, workflow-scoped npm token, so there is no NPM_TOKEN in
      # this repository's secrets and nothing long-lived to leak. npm attaches
      # provenance automatically when published this way.
      id-token: write
      contents: read
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: An npm new enough to do this
        # Trusted publishing needs npm >= 11.5.1 and Node >= 22.14. Node 24
        # ships past both today, so this is insurance rather than a fix: the
        # bundled npm is whatever the runner image happens to carry, and the
        # failure if it is too old is an auth error that reads like a
        # misconfigured publisher rather than a stale client.
        run: |
          npm install -g npm@latest
          npm --version

      - name: Collect the tested tarballs
        # The same artifact `ready` reports on: the exact bytes that were
        # installed into a real Expo app and built against three desktops.
        # Re-packing here would publish something nothing has run.
        uses: actions/download-artifact@v8
        with:
          name: tarballs
          path: tarballs

      - name: Publish
        # Core first, because the other five pin it by exact version and a
        # registry that has the dependents before the dependency is briefly
        # uninstallable. `npm publish <tarball>` skips prepack, which is the
        # point -- prepack typechecks and needs a React Native checkout this
        # job does not have, and re-running it would produce different bytes
        # from the ones that were tested.
        run: |
          set -euo pipefail
          core=$(ls tarballs/react-native-basalt-[0-9]*.tgz)
          echo "== $core"
          npm publish "$core" --access public
          for tarball in tarballs/*.tgz; do
            [ "$tarball" = "$core" ] && continue
            echo "== $tarball"
            npm publish "$tarball" --access public
          done
