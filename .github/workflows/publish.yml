name: Publish

# Uploading the tarballs a release run built, over trusted publishing.
#
# Separate from release.yml, and callable on its own, because the publish step
# is twelve seconds at the end of a forty-minute gauntlet and the two failure
# rates are nothing alike. Three attempts in a row died here -- an npm spec
# parsed as a GitHub shorthand, a missing --tag, a credential -- and each cost
# a full cold rebuild of three platforms to reach. Re-running a job uses the
# workflow file the original run had, so a fix to the publish step cannot be
# tested that way either; it needed a new tag every time.
#
# Dispatched with the run id of a release, this takes about a minute. The
# tarballs are kept for seven days, which is the window in which that is
# possible.

on:
  workflow_call:
    inputs:
      run-id:
        type: string
        required: false
        default: ''
  workflow_dispatch:
    inputs:
      run-id:
        description: The Release run whose tarballs to publish
        type: string
        required: true
      check-only:
        description: Only check the trusted publisher, publish nothing
        type: boolean
        required: false
        default: false

jobs:
  publish:
    name: publish to npm
    runs-on: ubuntu-24.04
    permissions:
      # The whole credential. Trusted publishing exchanges this OIDC token for
      # a short-lived, workflow-scoped npm token, so there is no NPM_TOKEN in
      # this repository and nothing long-lived to leak. npm attaches provenance
      # automatically when published this way.
      id-token: write
      contents: read
      # Reading an artifact that belongs to another run.
      actions: read
    steps:
      # Has to live here rather than in a workflow of its own, which is where
      # I first put it. The OIDC token carries a job_workflow_ref claim naming
      # the workflow that minted it, and npm matches that against the
      # registration -- so a probe in trusted-publisher-check.yml reported
      # "package not found" for six correctly configured packages, because the
      # name it presented was the probe's own. A check for whether a workflow
      # is trusted is only meaningful from inside that workflow.
      #
      # 200 means the registration matches. 404 "package not found" means npm
      # holds nothing it will accept -- not that the package is missing.
      # Fields are case-sensitive, and Allowed actions must permit
      # `npm publish`; only `npm stage publish` is granted by default.
      - name: Is this workflow trusted?
        if: ${{ inputs.check-only }}
        run: |
          set -uo pipefail
          tok=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=npm%3Aregistry.npmjs.org" |
            node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{
              process.stdout.write(JSON.parse(s).value||"")})')
          [ -n "$tok" ] || { echo "no OIDC token"; exit 1; }
          echo "token: ${#tok} chars"
          bad=0
          for p in react-native-basalt react-native-basalt-appkit \
                   react-native-basalt-gtk react-native-basalt-notifications \
                   react-native-basalt-subprocess react-native-basalt-win32; do
            out=$(curl -sS -w '\n%{http_code}' -X POST \
              -H "Authorization: Bearer $tok" \
              -H 'Content-Type: application/json' \
              "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/$p")
            code=$(printf '%s' "$out" | tail -1)
            [ "$code" = "200" ] || bad=1
            printf '  %-34s %s\n' "$p" "$code"
          done
          exit $bad

      - uses: actions/setup-node@v7
        if: ${{ !inputs.check-only }}
        with:
          node-version: 24
          # Deliberately no registry-url. It writes an .npmrc containing
          # `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}`, and with no
          # such secret set that is an empty credential npm may present instead
          # of exchanging its OIDC token.

      - name: An npm new enough to do this
        if: ${{ !inputs.check-only }}
        # Trusted publishing needs npm >= 11.5.1 and Node >= 22.14. Node 24
        # ships past both, so this is insurance: the bundled npm is whatever
        # the runner image carries, and the failure if it is too old is an auth
        # error that reads like a misconfigured publisher rather than a stale
        # client.
        run: |
          npm install -g npm@latest
          node --version
          npm --version

      - name: Collect the tested tarballs
        if: ${{ !inputs.check-only }}
        # The artifact the Expo job produced: the exact bytes installed into a
        # real app and built against three desktops. Packing again here would
        # publish something nothing has run.
        uses: actions/download-artifact@v8
        with:
          name: tarballs
          path: tarballs
          run-id: ${{ inputs.run-id || github.run_id }}
          github-token: ${{ github.token }}

      - name: Publish
        if: ${{ !inputs.check-only }}
        # Core first, because the other five pin it by exact version and a
        # registry holding dependents before the dependency is briefly
        # uninstallable. `npm publish <tarball>` skips prepack, which is the
        # point: prepack typechecks and needs a React Native checkout this job
        # does not have, and re-running it would upload different bytes from
        # the ones that were tested.
        #
        # Every path is written `./tarballs/...` and the leading `./` is
        # load-bearing. `npm publish` takes a package spec rather than a
        # filename, and a bare `a/b` is GitHub shorthand -- so
        # `npm publish tarballs/react-native-basalt-0.0.0-rc2.tgz` refused with
        # EALLOWGIT and "Refusing to fetch github:tarballs/...", having never
        # looked at the disk.
        run: |
          set -euo pipefail
          # Skipping what is already up, so a retry is a retry. npm answers a
          # second publish of the same version with a 409, which would stop
          # this at the first package and say nothing about the ones that
          # actually still need doing -- exactly the wrong failure when the
          # reason for running again is usually that one package of six did
          # not make it.
          # When this fails with ENEEDAUTH, add --loglevel verbose. npm says
          # nothing about OIDC at the default level, so a missing trusted
          # publisher and a client too old to try look identical. Verbose
          # prints the GitHub token fetch (audience=npm:registry.npmjs.org) and
          # then the exchange:
          #   POST /-/npm/v1/oidc/token/exchange/package/<name>
          #   oidc Failed token exchange request ... package not found
          # That endpoint is per package, and "package not found" means no
          # trusted publisher is configured for it, not that the package is
          # missing. trusted-publisher-check.yml asks it directly, for every
          # package, without publishing anything.
          publish() {
            # The \n matters. `read` returns non-zero at EOF without a
            # trailing delimiter, and under `set -e` that ends the step before
            # it prints anything at all -- which is what it did: a Publish step
            # that failed with no output whatsoever and looked like an auth
            # problem.
            local name version
            read -r name version < <(tar -xzOf "$1" package/package.json |
              node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{
                const m=JSON.parse(s);process.stdout.write(`${m.name} ${m.version}\n`);})')
            if [ "$(npm view "$name@$version" version 2>/dev/null)" = "$version" ]; then
              echo "== $name@$version already published, skipping"
              return 0
            fi
            echo "== $1"
            # --tag is required, not decorative: npm refuses to publish a
            # prerelease without one rather than let 0.0.0-rc2 quietly become
            # `latest`. `rc` is the tag 0.0.0-rc1 already carries.
            npm publish "$1" --access public --tag rc
          }
          core=$(ls ./tarballs/react-native-basalt-[0-9]*.tgz)
          publish "$core"
          for tarball in ./tarballs/*.tgz; do
            [ "$tarball" = "$core" ] && continue
            publish "$tarball"
          done

      - name: Point latest at it
        if: ${{ !inputs.check-only }}
        # 0.0.0-rc1 holds both `rc` and `latest`, because npm sets `latest` on
        # a package's first publish whatever tag it was given. Every release
        # here is a release candidate, so leaving `latest` behind would mean
        # `npm install react-native-basalt` went on handing out the older one.
        # Separate from the publish above so that failing here is a wrong
        # dist-tag to fix by hand rather than half a release.
        run: |
          # Not `set -e`: a dist-tag that fails is a tag to fix by hand, and
          # failing the job over one would report a release that did happen as
          # a release that did not.
          set -uo pipefail
          for tarball in ./tarballs/*.tgz; do
            read -r name version < <(tar -xzOf "$tarball" package/package.json |
              node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{
                const m=JSON.parse(s);process.stdout.write(`${m.name} ${m.version}\n`);})')
            echo "== $name@$version -> latest"
            npm dist-tag add "$name@$version" latest
          done
