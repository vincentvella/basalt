name: Publish

# Uploading the tarballs a release run built, over trusted publishing.
#
# Separate from release.yml, and callable on its own, because the publish step
# is twelve seconds at the end of a forty-minute gauntlet and the two failure
# rates are nothing alike. Three attempts in a row died here -- an npm spec
# parsed as a GitHub shorthand, a missing --tag, a credential -- and each cost
# a full cold rebuild of three platforms to reach. Re-running a job uses the
# workflow file the original run had, so a fix to the publish step cannot be
# tested that way either; it needed a new tag every time.
#
# Dispatched with the run id of a release, this takes about a minute. The
# tarballs are kept for seven days, which is the window in which that is
# possible.

on:
  workflow_call:
    inputs:
      run-id:
        type: string
        required: false
        default: ''
      check-only:
        type: boolean
        required: false
        default: false
  workflow_dispatch:
    inputs:
      run-id:
        description: A Release run whose tarballs to publish. Leave empty to pack from this checkout and skip the gauntlet.
        type: string
        required: false
        default: ''
      check-only:
        description: Only check the trusted publisher, publish nothing
        type: boolean
        required: false
        default: false

jobs:
  publish:
    name: publish to npm
    runs-on: ubuntu-24.04
    permissions:
      # The whole credential. Trusted publishing exchanges this OIDC token for
      # a short-lived, workflow-scoped npm token, so there is no NPM_TOKEN in
      # this repository and nothing long-lived to leak. npm attaches provenance
      # automatically when published this way.
      id-token: write
      contents: read
      # Reading an artifact that belongs to another run.
      actions: read
    steps:
      # Two registrations are needed on npmjs.com, per package, and this is
      # why. npm matches the OIDC token's *calling* workflow, so a reusable
      # workflow reached through `uses:` presents the caller's name, not its
      # own. Measured, through the same probe on the same day:
      #
      #   dispatched directly              publish.yml   201 x 6
      #   called from release.yml          release.yml   404 x 6
      #
      # So a package needs both publish.yml (the standalone retry) and
      # release.yml (a tagged release) registered, or one of the two paths
      # silently cannot authenticate -- and the check passing tells you
      # nothing about the path you are not on.
      #
      # Has to live here rather than in a workflow of its own, which is where
      # I first put it. The OIDC token carries a job_workflow_ref claim naming
      # the workflow that minted it, and npm matches that against the
      # registration -- so a probe in trusted-publisher-check.yml reported
      # "package not found" for six correctly configured packages, because the
      # name it presented was the probe's own. A check for whether a workflow
      # is trusted is only meaningful from inside that workflow.
      #
      # 201 means the registration matches and npm issued a credential. 404
      # "package not found" means npm holds nothing it will accept -- not that
      # the package is missing.
      # Fields are case-sensitive, and Allowed actions must permit
      # `npm publish`; only `npm stage publish` is granted by default.
      - name: Is this workflow trusted?
        if: ${{ inputs.check-only }}
        run: |
          set -uo pipefail
          tok=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=npm%3Aregistry.npmjs.org" |
            node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{
              process.stdout.write(JSON.parse(s).value||"")})')
          [ -n "$tok" ] || { echo "no OIDC token"; exit 1; }
          echo "token: ${#tok} chars"
          bad=0
          for p in basalt-core basalt-appkit \
                   basalt-gtk basalt-notifications \
                   basalt-subprocess basalt-win32; do
            out=$(curl -sS -w '\n%{http_code}' -X POST \
              -H "Authorization: Bearer $tok" \
              -H 'Content-Type: application/json' \
              "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/$p")
            code=$(printf '%s' "$out" | tail -1)
            # 201, not 200: the endpoint mints a credential, so success is
            # Created. Asserting 200 reported six working registrations as
            # broken and sent me back to npmjs.com looking for a fault there.
            case "$code" in 200|201) ;; *) bad=1 ;; esac
            printf '  %-34s %s\n' "$p" "$code"
          done
          exit $bad

      - uses: actions/checkout@v7
        if: ${{ !inputs.check-only && !inputs.run-id }}

      - uses: actions/setup-node@v7
        if: ${{ !inputs.check-only }}
        with:
          node-version: 24
          # Deliberately no registry-url. It writes an .npmrc containing
          # `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}`, and with no
          # such secret set that is an empty credential npm may present instead
          # of exchanging its OIDC token.

      - name: An npm new enough to do this
        if: ${{ !inputs.check-only }}
        # Trusted publishing needs npm >= 11.5.1 and Node >= 22.14. Node 24
        # ships past both, so this is insurance: the bundled npm is whatever
        # the runner image carries, and the failure if it is too old is an auth
        # error that reads like a misconfigured publisher rather than a stale
        # client.
        run: |
          npm install -g npm@latest
          node --version
          npm --version

      # Packing here rather than taking a release run's artifact, when no run
      # is named. The gauntlet answers "does someone else's app get a working
      # desktop from npm install", which is the right question for a release
      # and the wrong one for "does the publish step work" -- and answering
      # the second with the first cost half an hour a go.
      #
      # So: name a run and the tested bytes are published; name none and this
      # packs the checkout and publishes that. The second is for fixing the
      # publish path, and for a release whose contents a run has already
      # verified.
      - name: Read the React Native pin
        if: ${{ !inputs.check-only && !inputs.run-id }}
        id: pin
        run: echo "ref=$(grep -v '^#' scripts/react-native.pin | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"

      - name: Fetch React Native at the pinned release
        # core's prepack typechecks, which needs React Native's own sources;
        # npm pack runs prepack, so packing without this fails on the fifth
        # package after the other five have already been written.
        if: ${{ !inputs.check-only && !inputs.run-id }}
        run: |
          mkdir -p "$RUNNER_TEMP/react-native-src" && cd "$RUNNER_TEMP/react-native-src"
          git init -q
          git remote add origin https://github.com/react/react-native
          git fetch -q --depth 1 origin refs/tags/${{ steps.pin.outputs.ref }}
          git checkout -q FETCH_HEAD

      - name: Restore React Native's node_modules
        if: ${{ !inputs.check-only && !inputs.run-id }}
        id: node-modules
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/react-native-src/node_modules
          key: rn-node-modules-${{ runner.os }}-${{ steps.pin.outputs.ref }}

      - name: Install React Native's dependencies
        if: ${{ !inputs.check-only && !inputs.run-id && steps.node-modules.outputs.cache-hit != 'true' }}
        working-directory: ${{ runner.temp }}/react-native-src
        run: yarn install --frozen-lockfile

      - name: Pack
        if: ${{ !inputs.check-only && !inputs.run-id }}
        run: |
          set -euo pipefail
          mkdir -p tarballs
          for package in packages/*/; do
            RN_DIR="$RUNNER_TEMP/react-native-src" \
              npm pack "$package" --pack-destination tarballs
          done
          ls -l tarballs

      - name: Collect the tested tarballs
        if: ${{ !inputs.check-only && inputs.run-id }}
        # The artifact the Expo job produced: the exact bytes installed into a
        # real app and built against three desktops. Packing again here would
        # publish something nothing has run.
        uses: actions/download-artifact@v8
        with:
          name: tarballs
          path: tarballs
          run-id: ${{ inputs.run-id || github.run_id }}
          github-token: ${{ github.token }}

      - name: Publish
        if: ${{ !inputs.check-only }}
        # Core first, because the other five pin it by exact version and a
        # registry holding dependents before the dependency is briefly
        # uninstallable. `npm publish <tarball>` skips prepack, which is the
        # point: prepack typechecks and needs a React Native checkout this job
        # does not have, and re-running it would upload different bytes from
        # the ones that were tested.
        #
        # Every path is written `./tarballs/...` and the leading `./` is
        # load-bearing. `npm publish` takes a package spec rather than a
        # filename, and a bare `a/b` is GitHub shorthand -- so
        # `npm publish tarballs/basalt-core-0.0.0-rc2.tgz` refused with
        # EALLOWGIT and "Refusing to fetch github:tarballs/...", having never
        # looked at the disk.
        run: |
          set -euo pipefail
          # Skipping what is already up, so a retry is a retry. npm answers a
          # second publish of the same version with a 409, which would stop
          # this at the first package and say nothing about the ones that
          # actually still need doing -- exactly the wrong failure when the
          # reason for running again is usually that one package of six did
          # not make it.
          # When this fails with ENEEDAUTH, add --loglevel verbose. npm says
          # nothing about OIDC at the default level, so a missing trusted
          # publisher and a client too old to try look identical. Verbose
          # prints the GitHub token fetch (audience=npm:registry.npmjs.org) and
          # then the exchange:
          #   POST /-/npm/v1/oidc/token/exchange/package/<name>
          #   oidc Failed token exchange request ... package not found
          # That endpoint is per package, and "package not found" means no
          # trusted publisher is configured for it, not that the package is
          # missing. trusted-publisher-check.yml asks it directly, for every
          # package, without publishing anything.
          publish() {
            # The \n matters. `read` returns non-zero at EOF without a
            # trailing delimiter, and under `set -e` that ends the step before
            # it prints anything at all -- which is what it did: a Publish step
            # that failed with no output whatsoever and looked like an auth
            # problem.
            local name version
            read -r name version < <(tar -xzOf "$1" package/package.json |
              node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{
                const m=JSON.parse(s);process.stdout.write(`${m.name} ${m.version}\n`);})')
            if [ "$(npm view "$name@$version" version 2>/dev/null)" = "$version" ]; then
              echo "== $name@$version already published, skipping"
              return 0
            fi
            echo "== $1"
            # --tag is required, not decorative: npm refuses to publish a
            # prerelease without one rather than let it quietly become
            # `latest`. And it says `latest` rather than `rc` because the tag
            # has to be set here or not at all -- npm answers a dist-tag
            # change made with an OIDC credential with
            # "OIDC dist-tag operations are not yet enabled for this package",
            # so a separate step to move it afterwards cannot work however it
            # authenticates. Every release here is a release candidate, so
            # `latest` is the tag that matters: it is what a plain
            # `npm install basalt-core` resolves to.
            npm publish "$1" --access public --tag latest
          }
          core=$(ls ./tarballs/basalt-core-[0-9]*.tgz)
          publish "$core"
          for tarball in ./tarballs/*.tgz; do
            [ "$tarball" = "$core" ] && continue
            publish "$tarball"
          done

      # No step to move `latest` afterwards. There was one, and it could
      # never have worked: npm refuses dist-tag changes made with an OIDC
      # credential -- 403, "OIDC dist-tag operations are not yet enabled for
      # this package" -- whether the credential comes from the publish above
      # or from an exchange of its own. Publishing with --tag latest sets it
      # in the one operation OIDC does allow.
      #
      # A consequence worth knowing: `rc` no longer follows a release. It sits
      # wherever it was last put by hand. Moving it needs a human credential,
      # for the same reason.

      - name: Move the rc tag too
        if: ${{ !inputs.check-only }}
        # `npm publish --tag latest` above sets the tag that `npm install`
        # resolves, and only that one. `rc` needs a second operation, which
        # npm refused until this package granted `npm dist-tag` to its trusted
        # publisher -- the 403 said "OIDC dist-tag operations are not yet
        # enabled for this package", which reads like a missing feature and is
        # a missing permission.
        #
        # Its own exchange, because `npm publish` performs one and any package
        # already at this version is skipped, so a rerun fixing one package of
        # six would have no credential for the other five.
        #
        # Not `set -e`: a tag that fails to move is a tag to fix by hand, and
        # failing the job over one would report a release that did happen as a
        # release that did not.
        run: |
          set -uo pipefail
          oidc=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=npm%3Aregistry.npmjs.org" |
            node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{
              process.stdout.write(JSON.parse(s).value||"")})')
          [ -n "$oidc" ] || { echo "no OIDC token"; exit 0; }
          for tarball in ./tarballs/*.tgz; do
            read -r name version < <(tar -xzOf "$tarball" package/package.json |
              node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{
                const m=JSON.parse(s);process.stdout.write(`${m.name} ${m.version}\n`);})')
            [ "$(npm view "$name" dist-tags.rc 2>/dev/null)" = "$version" ] && {
              printf '  %-34s rc already %s\n' "$name" "$version"; continue; }
            tok=$(curl -sS -X POST -H "Authorization: Bearer $oidc" \
              -H 'Content-Type: application/json' \
              "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/$name" |
              node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{
                try{process.stdout.write(JSON.parse(s).token||"")}catch{}})')
            [ -n "$tok" ] || { printf '  %-34s no credential\n' "$name"; continue; }
            echo "::add-mask::$tok"
            printf '//registry.npmjs.org/:_authToken=%s\n' "$tok" > "$HOME/.npmrc"
            if npm dist-tag add "$name@$version" rc; then
              printf '  %-34s rc -> %s\n' "$name" "$version"
            else
              printf '  %-34s rc dist-tag failed\n' "$name"
            fi
            rm -f "$HOME/.npmrc"
          done
