name: OIDC check
# Temporary. Answers one question -- does this repository actually hand a job
# an OIDC token when it asks for one -- without paying for the release
# gauntlet to find out. Delete once the answer is known.
on: workflow_dispatch

jobs:
  check:
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Is there an OIDC token to be had?
        run: |
          echo "ACTIONS_ID_TOKEN_REQUEST_URL set: ${ACTIONS_ID_TOKEN_REQUEST_URL:+yes}${ACTIONS_ID_TOKEN_REQUEST_URL:-NO}"
          echo "ACTIONS_ID_TOKEN_REQUEST_TOKEN set: ${ACTIONS_ID_TOKEN_REQUEST_TOKEN:+yes}${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-NO}"
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: npm version, and what it thinks of the registry
        run: |
          npm install -g npm@latest >/dev/null 2>&1
          npm --version
          echo "--- whoami (expect a name if OIDC works, an error if not) ---"
          npm whoami --registry https://registry.npmjs.org || true
